<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>SKU Studio · 本地可视化编辑器</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/editor.css">
</head>
<body>
  <div class="studio-ambient" aria-hidden="true">
    <span class="studio-ambient__a"></span>
    <span class="studio-ambient__b"></span>
    <span class="studio-ambient__c"></span>
    <span class="studio-ambient__noise"></span>
  </div>

  <div class="studio">
    <aside class="studio-sidebar glass" id="studioSidebar">
      <div class="studio-brand">
        <span class="studio-brand__mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="3" width="16" height="18" rx="2.2"></rect>
            <path d="M4 11h16M12 3v18M8.4 7h.01M15.6 15h.01"></path>
          </svg>
        </span>
        <span class="studio-brand__copy">
          <strong>SKU Studio</strong>
          <small>本地内容工作台</small>
        </span>
      </div>

      <div class="server-chip" id="serverChip">
        <span class="server-chip__dot" aria-hidden="true"></span>
        <span id="serverStatus">正在连接本地服务…</span>
      </div>

      <nav class="studio-nav" id="studioNav" aria-label="编辑模块"></nav>

      <div class="studio-sidebar__foot">
        <div class="local-note">
          <span class="local-note__badge">LOCAL</span>
          <span>修改只写入本机项目文件</span>
        </div>
        <a class="side-link" href="/" target="_blank" rel="noopener">
          打开完整前台
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 4h6v6M20 4l-9 9"></path>
            <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"></path>
          </svg>
        </a>
      </div>
    </aside>

    <div class="studio-main">
      <header class="studio-topbar">
        <div class="section-heading">
          <p class="section-kicker" id="sectionKicker">VISUAL STUDIO</p>
          <h1 id="sectionTitle">页面文案</h1>
        </div>
        <div class="topbar-actions">
          <span class="sync-state" id="syncState"><span class="sync-state__dot" aria-hidden="true"></span><span id="syncText">已同步</span></span>
          <div class="pane-switch" id="paneSwitch" role="group" aria-label="编辑或预览">
            <button type="button" data-pane="edit" class="is-active">编辑</button>
            <button type="button" data-pane="preview">预览</button>
          </div>
          <button class="btn btn--ghost btn--compact" type="button" id="revertButton">撤销更改</button>
          <button class="btn btn--primary btn--compact" type="button" id="saveButton">
            <span id="saveButtonText">保存并应用</span>
            <kbd>⌘ S</kbd>
          </button>
        </div>
      </header>

      <div class="studio-body">
        <section class="editor-pane" id="editorPane">
          <div class="loading-panel" id="loadingPanel">
            <span class="loading-dot"></span>
            <span>正在读取项目文件…</span>
          </div>
          <div id="sectionContent"></div>
        </section>

        <aside class="preview-pane glass" id="previewPane">
          <div class="preview-toolbar">
            <div class="preview-title">
              <span class="live-dot" aria-hidden="true"></span>
              <span>实时预览</span>
              <small>自动刷新</small>
            </div>
            <div class="preview-actions">
              <div class="viewport-switch" id="viewportSwitch" role="group" aria-label="预览宽度">
                <button type="button" data-viewport="desktop" title="桌面预览" aria-label="桌面预览">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="12" rx="2"></rect>
                    <path d="M8 20h8M12 16v4"></path>
                  </svg>
                </button>
                <button type="button" data-viewport="tablet" title="平板预览" aria-label="平板预览">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="5" y="2.5" width="14" height="19" rx="2.5"></rect>
                    <path d="M11 18.5h2"></path>
                  </svg>
                </button>
                <button type="button" data-viewport="mobile" title="手机预览" aria-label="手机预览">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="7" y="2.5" width="10" height="19" rx="2.5"></rect>
                    <path d="M11 18.5h2"></path>
                  </svg>
                </button>
              </div>
              <button class="icon-action" type="button" id="refreshPreview" title="刷新预览" aria-label="刷新预览">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M3.5 11a8.5 8.5 0 1 0 2.2-6.3L3 7.4"></path>
                  <path d="M3 3v4.4h4.4"></path>
                </svg>
              </button>
              <a class="icon-action" href="/" target="_blank" rel="noopener" title="在新窗口打开前台" aria-label="在新窗口打开前台">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M14 4h6v6M20 4l-9 9"></path>
                  <path d="M18 13v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"></path>
                </svg>
              </a>
            </div>
          </div>
          <div class="preview-stage" id="previewStage">
            <div class="preview-browser" id="previewBrowser" data-viewport="desktop">
              <iframe id="previewIframe" title="前台预览" loading="eager"></iframe>
            </div>
          </div>
          <div class="preview-foot">
            <span id="previewLabel">桌面 · 实时同步</span>
            <span class="preview-foot__hint">保存后自动刷新</span>
          </div>
        </aside>
      </div>
    </div>
  </div>

  <div class="connection-screen" id="connectionScreen" hidden>
    <div class="connection-card glass">
      <div class="connection-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"></path>
          <circle cx="12" cy="12" r="3.5"></circle>
        </svg>
      </div>
      <p class="connection-kicker">LOCAL ONLY</p>
      <h2>编辑器需要本地服务</h2>
      <p>请通过项目根目录的一键启动脚本打开编辑器。直接双击 HTML 文件无法同步代码。</p>
      <pre><code>启动编辑器.cmd</code></pre>
      <div class="connection-actions">
        <button class="btn btn--primary" type="button" id="retryConnection">重新连接</button>
        <a class="btn btn--ghost" href="/" target="_blank" rel="noopener">先查看前台</a>
      </div>
    </div>
  </div>

  <div class="editor-toast" id="editorToast" role="status" aria-live="polite">
    <span class="editor-toast__icon" aria-hidden="true"></span>
    <span id="editorToastText"></span>
  </div>

  <div class="editor-dialog-layer" id="editorDialogLayer" aria-hidden="true"></div>

  <script src="js/editor.js" defer></script>
</body>
</html>
